<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtividade da Operação</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://grid.adminml.com/grid-sdk.js"></script>
</head>
<body>

<header class="hd">
  <div class="hd-info">
    <h1>Produtividade(Beta)</h1>
    <small id="hd-facility">SSP20 · —</small>
  </div>
  <div class="hd-right">
    <div class="hd-status" id="hd-status-btn" onclick="carregarDados()"><span class="dot" id="status-dot"></span><span id="status-text">carregando…</span></div>
    <button id="tv-btn" class="tv-btn" title="Modo TV"></button>
    <div class="hd-clock" id="clock">--:--</div>
  </div>
</header>

<nav class="nav-bar">
  <div class="nav-tab active" data-page="sorting">Sorting</div>
  <div class="nav-tab" data-page="divisaohc">Divisão HC</div>
</nav>

<!-- ── PÁGINA: SORTING ── -->
<div id="page-sorting">
  <div class="subnav">
    <div class="subtab active-guarda" data-sub="guarda"> Guarda</div>
    <div class="subtab" data-sub="inducao"> Indução</div>
  </div>
  <div class="cyclerow">
    <span class="label">Ciclo:</span>
    <div class="chip-cycle active" data-cycle="TODOS">Todos</div>
    <div class="chip-cycle" data-cycle="AM1">AM1</div>
    <div class="chip-cycle" data-cycle="PM1">PM1</div>
    <div class="chip-cycle" data-cycle="SD">SD</div>
    <div class="chip-cycle" data-cycle="SDE1">SDE1</div>
  </div>
  <div class="content">
    <div class="updated-line" id="updated-line"></div>
    <div id="status-msg"></div>
<div id="oauth-box" class="oauth-box" style="display:none">
  <div class="oauth-icon">🔑</div>
  <p>Conexão com Google Sheets não autorizada</p>
  <button id="oauth-btn" class="oauth-btn" onclick="autorizarOAuth()">Autorizar Google Sheets</button>
  <button class="oauth-btn oauth-btn-sec" onclick="carregarDados()">🔄 Tentar novamente</button>
</div>
    <div class="summary-bar" id="summary-bar"></div>
    <div class="rank-list" id="rank-list"></div>
  </div>
</div>


<!-- ── PÁGINA: DIVISÃO HC ── -->
<div id="page-divisaohc" style="display:none">
  <div class="subnav">
    <div class="subtab-hc active-hc-sorting" data-hcsub="hc-sorting">Sorting</div>
    <div class="subtab-hc" data-hcsub="hc-carregamento">Carregamento</div>
  </div>

  <div class="hc-toolbar">
    <div class="hc-search-box">
      <input type="text" id="hc-search-input" placeholder="🔍  Digite seu nome..." autocomplete="off">
      <button id="hc-search-clear" class="hc-clear-btn" style="display:none">✕</button>
    </div>
    <button id="hc-mapa-btn" class="hc-mapa-btn" title="Ver mapa visual">🗺️ Mapa</button>
  </div>

  <div id="hc-results" class="hc-results">
    <div class="hc-placeholder">
      <div class="emoji">🔍</div>
      <p>Digite seu nome para encontrar sua posição</p>
    </div>
  </div>

  <!-- Mapa visual (overlay) -->
  <div id="hc-mapa-overlay" class="hc-mapa-overlay" style="display:none">
    <div class="hc-mapa-header">
      <h2 id="hc-mapa-titulo">🗺️ Mapa — Sorting</h2>
      <div class="hc-mapa-actions">
        <button onclick="window.print()" class="hc-print-btn">🖨️ Imprimir</button>
        <button onclick="fecharMapa()" class="hc-close-btn">✕</button>
      </div>
    </div>
    <div id="hc-mapa-content" class="hc-mapa-content"></div>
  </div>
</div>

<!-- ── MODO TV (overlay fullscreen) ── -->
<div id="tv-overlay" class="tv-overlay" style="display:none">
  <div class="tv-header">
    <div class="tv-header-left">
      <h1 class="tv-titulo">Produtividade</h1>
      <small id="tv-facility">SSP20 · —</small>
    </div>
    <div class="tv-header-right">
      <div class="tv-aba-label" id="tv-aba-label">GUARDA</div>
      <div class="tv-ciclo-label" id="tv-ciclo-label">TODOS</div>
      <div class="tv-clock" id="tv-clock">--:--</div>
      <button id="tv-exit-btn" class="tv-exit-btn" title="Sair do modo TV">✕</button>
    </div>
  </div>
  <div class="tv-content" id="tv-content">
    <div class="tv-rank-list" id="tv-rank-list"></div>
  </div>
</div>

<!-- ── SCRIPTS ── -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/data-service.js"></script>
<script src="js/render.js"></script>
<script src="js/dimensionamento.js"></script>
<script src="js/navigation.js"></script>
<script src="js/tv-mode.js"></script>
<script src="js/main.js"></script>

</body>
</html>
